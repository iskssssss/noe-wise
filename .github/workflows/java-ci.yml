name: Java CI

on:
  push:
    paths:
      - "backend-java/**"
      - "!backend-java/**/*.md"
      - "backend-java/skillforge-prompts/src/main/resources/**"
      - ".github/workflows/java-ci.yml"
      - "tools/ci/institution-first-oom.init.gradle"
      - "tools/database/**"
  pull_request:
    paths:
      - "backend-java/**"
      - "!backend-java/**/*.md"
      - "backend-java/skillforge-prompts/src/main/resources/**"
      - ".github/workflows/java-ci.yml"
      - "tools/ci/institution-first-oom.init.gradle"
      - "tools/database/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend workspace for browser integration tests
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: .
        run: pnpm --filter frontend-admin exec playwright install --with-deps chromium
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        env:
          SKILLFORGE_OOM_EVIDENCE_DIR: ${{ runner.temp }}/institution-oom-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export SKILLFORGE_OOM_SOURCE_SHA="$(git rev-parse HEAD)"
          ./gradlew build --no-daemon --init-script ../tools/ci/institution-first-oom.init.gradle
      - name: Upload institution worker evidence
        if: ${{ always() && github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: institution-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/institution-oom-${{ github.run_id }}-${{ github.run_attempt }}/
            backend-java/skillforge-institution-service/build/test-results/test/TEST-*.xml
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
