packages:
  - desktop-client
  - frontend-admin
  - frontend-platform
  - frontend-chat
  - frontend-website
  - frontend-shared

strictPeerDependencies: false
autoInstallPeers: true

catalog:
  eslint: ^10.12.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.57.0
  eslint-plugin-vue: ^10.8.0
  globals: ^16.5.0
  prettier: ^3.8.1
  eslint-config-prettier: ^10.1.8
  '@vitejs/plugin-vue': ^6.0.7
  element-plus: ^2.14.0
  pinia: ^3.0.4
  sass: ^1.99.0
  typescript: ^6.0.3
  unplugin-element-plus: ^0.11.2
  vite: 8.3.3
  vue: ^3.5.34
  vue-i18n: 11.4.14
  vue-router: ^5.0.7
  vue-tsc: ^3.3.1

overrides:
  vue: 'catalog:'
  pinia: 'catalog:'
  vue-router: 'catalog:'
  vue-i18n: 'catalog:'
  source-map-js: 1.2.2

onlyBuiltDependencies:
  - electron
  - esbuild
  - vue-demi
  - '@tailwindcss/oxide'
