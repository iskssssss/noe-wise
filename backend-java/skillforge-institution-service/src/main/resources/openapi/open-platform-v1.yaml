          type: string
          minLength: 1
          maxLength: 256
          description: Stable source-system message identity, scoped by tenant, integration and Session; preserved without trimming.
        question:
          type: [string, 'null']
          maxLength: 65536
          description: Optional background question; missing or null becomes empty. At least question or answer must be nonblank.
