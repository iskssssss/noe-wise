        event: execution.completed
        event_id: evt_01J...
        session_id: ses_01J...
        session_sequence: 17
        input_id: inp_01J...
        root_input_id: inp_01J...
        caused_by_event_id: null
        event_version: 1
        occurred_at: '2026-09-27T10:00:00+08:00'
        data:
          status: completed
          runtime_event_id: run_evt_01J...
          sequence: 42
      required:
      - event
