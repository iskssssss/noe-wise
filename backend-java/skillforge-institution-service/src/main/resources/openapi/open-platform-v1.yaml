        mount_id:
          type: string
          minLength: 1
          description: Exact current Workflow mount ID on the Session Agent; not a capability name or client-defined execution handle.
        capability_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Exact published Workflow capability definition ID as a decimal string.
        version_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Exact published capability version ID as a decimal string; latest/default selection is not supported.
        parameters:
          type: object
          additionalProperties: true
          description: Required non-null dynamic business JSON object validated against the selected formal input_schema. It never supplies trusted identity or authorization.
