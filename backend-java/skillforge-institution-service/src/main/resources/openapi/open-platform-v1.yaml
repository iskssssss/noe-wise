          pattern: '^[0-9a-f]{64}$'
          description: Opaque stable archive identity; not an input_id, event_id or run_id.
        recorded:
          type: boolean
          const: true
        replayed:
          type: boolean
          description: True when an identical normalized source message was already archived.
