components:
  securitySchemes:
    servicePrincipalHmac:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Pair with X-Timestamp and X-Signature. Canonical input joins timestamp, uppercase HTTP method, request
        path plus ?rawQuery when present, and SHA-256 of original body bytes using LF; preserve query order and encoding.
  parameters:
    ResourceType:
      in: query
      name: resourceType
      schema:
        $ref: '#/components/schemas/ResourceType'
    ResourceStatus:
      in: query
      name: status
      schema:
        type: string
        enum:
        - draft
        - ready
        - published
        - archived
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    ResourceId:
      in: query
      name: resourceId
      required: true
      schema:
        type: string
        minLength: 1
    ExternalRef:
      in: query
      name: externalRef
      required: true
      schema:
        type: string
        minLength: 1
    Revision:
      in: query
      name: revision
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IfMatch:
      in: header
      name: If-Match
      schema:
        type: string
    DeploymentRevision:
      in: header
      name: X-Deployment-Revision
      schema:
        type: integer
        format: int64
        minimum: 1
    BindingRevision:
      in: header
      name: X-Binding-Revision
      schema:
        type: integer
        format: int64
