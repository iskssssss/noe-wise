      - caused_by_event_id
      - event_version
      - occurred_at
      - data
      properties:
        event:
          type: string
          description: Stable event name from the Session Outbox projection, such as execution.completed.
        event_id:
          type: string
          description: Stable opaque identifier allocated by the authoritative Session Outbox; it is used as the cursor.
        session_id:
          type: string
        session_sequence:
          type: integer
          format: int64
          description: Monotonic sequence allocated by the authoritative Session Outbox.
        input_id:
          type:
          - string
          - 'null'
        root_input_id:
          type:
          - string
          - 'null'
        caused_by_event_id:
          type:
          - string
          - 'null'
        event_version:
          type: integer
          format: int32
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: Event-specific map. Runtime-origin metadata is described by SessionEventData; non-Runtime events do
            not require those fields.
