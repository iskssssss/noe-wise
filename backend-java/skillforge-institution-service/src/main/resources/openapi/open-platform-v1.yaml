  /open-platform/sessions/messages/receipt:
    get:
      tags:
      - Session Runtime
      summary: Query the original message acceptance receipt without resubmitting
      description: FOUND proves acceptance only. NOT_OBSERVED does not prove not-sent, clear UNKNOWN, or authorize a retry. No Session or Run is created or awakened.
      x-required-scope: sessions.read
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Current observation of the original message acceptance
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MessageReceiptObservation'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /open-platform/sessions/workflow-invocations:
    post:
      tags: [Session Runtime]
      summary: Invoke an exact published Workflow mounted on the Session Agent
      description: >-
        Requires a formally configured Agent Session, including its existing model configuration readiness.
        Current tenant, integration, EndUser and business scope come from authenticated Session ownership.
        The selected mount must be current, published and user_invocable; parameters are validated against
        that exact formal descriptor input_schema before Run admission. Deterministic Workflow nodes do
        not prepare MODEL requests. Acceptance is not execution completion; use existing status, events,
        stream, actions and commands for progress, waits and cancellation. The same tenant, integration,
        Session and Idempotency-Key return the original Run for identical input. Changed mount, capability,
        version or parameters conflict. Object key order is ignored; array order and numeric precision remain.
      security:
      - servicePrincipalHmac: []
      x-required-scope: sessions.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWorkflowInvocationCommand'
      responses:
        '200':
          $ref: '#/components/responses/InboundReceipt'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          description: Current credential or Session authorization rejected, test Session rejected, or workflow_invocation_not_authorized.
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Session closed or execution_input_changed for changed input under the original key.
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          description: workflow_invocation_input_invalid for required, type or range violations of the exact published input_schema; workflow_invocation_invalid for Runtime payload limits. No Run is admitted on rejection.
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /open-platform/sessions/context-messages:
    post:
      tags: [Session Runtime]
      summary: Archive external business history without starting a Run
      description: >-
        Archives question and answer only as explicitly labelled external_business_context / context_only
        background. It cannot start or resume a Run, create an outbox delivery, or authorize replay of old effects.
        Current credential and Session ownership are rechecked on every append, including replay.
        Tenant, integration, Session and source_message_id define the stable archive identity;
        Idempotency-Key is not required or used. Identical normalized content returns the original message_id
        with replayed=true; changed content for that identity returns context_message_changed (409).
        Missing or null question/answer normalize to empty strings, but at least one must contain nonblank text.
      security:
      - servicePrincipalHmac: []
      x-required-scope: sessions.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContextMessageCommand'
      responses:
        '200':
          description: Recorded background receipt; never an execution or Run receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseContextMessageReceipt'
        '400':
          description: context_message_invalid for missing identity, excessive length or blank question and answer.
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
