import groovy.json.JsonOutput
import org.gradle.api.GradleException
import org.gradle.api.tasks.testing.Test
import java.nio.file.Files

// Collect only the institution ordinary Test worker during the existing Linux CI build.
// The workflow restricts raw heap evidence to a one-day private-repository artifact.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':skillforge-institution-service')
    if (target == null) throw new GradleException('institution_test_project_missing')
    def value = System.getenv('SKILLFORGE_OOM_EVIDENCE_DIR')
    if (!value || !new File(value).isAbsolute() || File.separator != '/') {
        throw new GradleException('fresh_absolute_linux_oom_evidence_directory_required')
    }
    def evidence = new File(value).canonicalFile
    def sourceSha = System.getenv('SKILLFORGE_OOM_SOURCE_SHA')
    if (!sourceSha || !(sourceSha ==~ /[0-9a-f]{40}/)) {
        throw new GradleException('oom_evidence_source_commit_required')
    }
    // runner.temp is the existing parent; never reuse an earlier run/attempt's directory.
    Files.createDirectory(evidence.toPath())
    new File(evidence, 'source-binding.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([
        sourceCommit: sourceSha, repository: System.getenv('GITHUB_REPOSITORY'),
        runId: System.getenv('GITHUB_RUN_ID'), runAttempt: System.getenv('GITHUB_RUN_ATTEMPT'),
        task: ':skillforge-institution-service:test'])), 'UTF-8')
    target.tasks.named('test', Test).configure { Test task ->
        // Preserve heap sizing, forks, ordering, assertions and the existing JaCoCo agent.
        def existing = task.jvmArgs ?: []
        if (existing.any { it.startsWith('-XX:HeapDumpPath=') ||
                it.contains('HeapDumpOnOutOfMemoryError') ||
                it.contains('ExitOnOutOfMemoryError') ||
                it.contains('CrashOnOutOfMemoryError') }) {
            throw new GradleException('review_existing_oom_jvm_options_before_capture')
        }
        task.jvmArgs(
            '-XX:+HeapDumpOnOutOfMemoryError',
            '-XX:HeapDumpPath=' + evidence.absolutePath + '/',
            '-XX:+ExitOnOutOfMemoryError',
            '-Xlog:gc+init=info:file=' + evidence.absolutePath +
                '/worker-%p-init.log:time,uptime,pid,level,tags:filecount=0',
            '-Xlog:gc+heap=info:file=' + evidence.absolutePath +
                '/worker-%p-heap.log:time,uptime,pid,level,tags:filecount=2,filesize=16M'
        )
        task.doFirst {
            def allowed = task.allJvmArgs.findAll { String argument ->
                argument.startsWith('-Xmx') || argument.startsWith('-Xms') ||
                argument.startsWith('-XX:MaxHeapSize=') ||
                argument.startsWith('-XX:InitialHeapSize=') ||
                argument.startsWith('-XX:MaxRAMPercentage=') ||
                argument.startsWith('-XX:InitialRAMPercentage=') ||
                argument.startsWith('-XX:ActiveProcessorCount=') ||
                argument.startsWith('-XX:+Use') || argument.startsWith('-XX:-Use') ||
                argument.startsWith('-XX:+HeapDumpOnOutOfMemoryError') ||
                argument.startsWith('-XX:HeapDumpPath=') ||
                argument.startsWith('-XX:+ExitOnOutOfMemoryError') ||
                argument.startsWith('-Xlog:gc+')
            }
            def jacoco = task.extensions.findByName('jacoco')
            def metadata = [task: task.path, configuredMaxHeap: task.maxHeapSize,
                configuredMinHeap: task.minHeapSize, maxParallelForks: task.maxParallelForks,
                forkEvery: task.forkEvery, failFast: task.failFast,
                jacocoEnabled: jacoco == null ? null : jacoco.enabled,
                heapAndDiagnosticArguments: allowed,
                note: 'Task configuration; actual worker PID/heap/GC are in worker-*-init.log.']
            new File(evidence, 'task-config.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(metadata)), 'UTF-8')
        }
        // Controller-side suite events preserve observed ordering without test stdout or payloads.
        task.beforeSuite { descriptor ->
            new File(evidence, 'suites.jsonl').append(JsonOutput.toJson([
                event: 'before', at: java.time.Instant.now().toString(),
                name: descriptor.name, className: descriptor.className,
                parent: descriptor.parent?.name]) + '\n', 'UTF-8')
        }
        task.afterSuite { descriptor, result ->
            new File(evidence, 'suites.jsonl').append(JsonOutput.toJson([
                event: 'after', at: java.time.Instant.now().toString(),
                name: descriptor.name, className: descriptor.className,
                parent: descriptor.parent?.name, result: result.resultType.toString(),
                tests: result.testCount, failed: result.failedTestCount]) + '\n', 'UTF-8')
        }
    }
}
