{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillforge.secretName" . }}
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "config.databaseUrl is required" .Values.config.databaseUrl | quote }}
  DATABASE_URL_SYNC: {{ required "config.databaseUrlSync is required" .Values.config.databaseUrlSync | quote }}
  REDIS_URL: {{ required "config.redisUrl is required" .Values.config.redisUrl | quote }}
  SKILLFORGE_ELASTICSEARCH_URI: {{ required "config.elasticsearchUrl is required" .Values.config.elasticsearchUrl | quote }}
  SECRET_KEY: {{ required "secrets.secretKey is required when secrets.existingSecret is empty" .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEYS: {{ required "secrets.encryptionKeys is required when secrets.existingSecret is empty" .Values.secrets.encryptionKeys | quote }}
  LLM_API_KEY: {{ required "secrets.llmApiKey is required when secrets.existingSecret is empty" .Values.secrets.llmApiKey | quote }}
  LLM_API_BASE: {{ .Values.secrets.llmApiBase | quote }}
  LLM_MODEL: {{ .Values.secrets.llmModel | quote }}
  LLM_EMBEDDING_MODEL: {{ .Values.secrets.llmEmbeddingModel | quote }}
{{- end }}
