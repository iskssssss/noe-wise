apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skillforge.fullname" . }}-config
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SKILLFORGE_ELASTICSEARCH_ENABLED: {{ .Values.config.elasticsearchEnabled | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
