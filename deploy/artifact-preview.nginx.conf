# 独立预览域配置片段；部署时替换server_name和机构预览监听地址。
server {
    listen 8091;
    server_name preview.localhost;
    access_log off;
    error_log /dev/null crit;
    location /p/ {
        proxy_pass http://skillforge-institution-service:8091;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_buffering off;
        proxy_cache off;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /d/ {
        proxy_pass http://skillforge-institution-service:8091;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_buffering off;
        proxy_cache off;
        add_header Referrer-Policy "no-referrer" always;
    }
    location / { return 404; }
}
